name: Build and release Workbench
on:
  push:
    branches: [main]
    paths: ['workbench/**', 'scripts/build-workbench.ps1', 'scripts/sync-workbench-assets.cjs', '.github/workflows/workbench-release.yml']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.402'
      - name: Validate application and public fixtures
        shell: pwsh
        run: |
          node scripts/sync-workbench-assets.cjs
          dotnet run --project workbench/tests/Tests.csproj -- workbench "$env:RUNNER_TEMP/tw-tests"
          if ($LASTEXITCODE -ne 0) { throw 'Contract tests failed' }
          foreach ($test in @('test-public-demo.js','test-workflow.js','test-access.js','test-intake.js','test-english-release.js')) {
            node "scripts/$test"
            if ($LASTEXITCODE -ne 0) { throw "Failed: $test" }
          }
      - name: Package the clean checkout
        shell: pwsh
        run: ./scripts/build-workbench.ps1 -Installer
      - name: Exercise the packaged local API with fictional data
        shell: pwsh
        run: |
          $dir = (Resolve-Path 'workbench/release/Tracewright-Workbench-Windows-v0.5.1-beta').Path
          $data = Join-Path $env:RUNNER_TEMP 'tw-http-qa'
          $p = Start-Process -FilePath "$dir/Tracewright Workbench.exe" -WorkingDirectory $dir -ArgumentList @('--no-browser','--port','18941','--data-dir',('"'+$data+'"')) -WindowStyle Hidden -PassThru
          try {
            for ($i=0; $i -lt 40 -and !(Test-Path "$data/local-port.txt"); $i++) { Start-Sleep -Milliseconds 500 }
            $port = Get-Content "$data/local-port.txt"
            node scripts/test-workbench-http.cjs "http://127.0.0.1:$port"
            if ($LASTEXITCODE -ne 0) { throw 'Packaged API tests failed' }
          } finally { if (!$p.HasExited) { Stop-Process -Id $p.Id -Force } }
      - name: Stage versioned artifacts for review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view workbench-v0.5.1-beta 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; do not overwrite a published version.' }
          $assets = @(Get-ChildItem -LiteralPath workbench/release -File | Where-Object { $_.Name -match '^(tracewright-workbench-windows-v0\.5\.1-beta\.zip|Tracewright-Workbench-Setup-v0\.5\.1-beta\.exe)(\.sha256\.txt)?$' } | ForEach-Object FullName)
          if ($assets.Count -ne 4) { throw 'Expected exactly four release assets' }
          gh release create workbench-v0.5.1-beta --target $env:GITHUB_SHA --draft --prerelease --title "Tracewright Workbench 0.5.1 beta" --notes-file docs/workbench-0.5.1-release.md @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
